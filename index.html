<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Movies - Cinema World</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #151515;
  padding: 20px;
  text-align: center;
  border-bottom: 2px solid #e50914;
}

header h1 {
  color: #e50914;
  font-size: 30px;
}

header p {
  color: #bbb;
  margin-top: 8px;
}

.search {
  padding: 20px;
  text-align: center;
}

.search input {
  width: 95%;
  max-width: 500px;
  padding: 14px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

h2 {
  padding: 10px 20px;
}

.movies {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 15px;
}

.movie {
  background: #1c1c1c;
  border-radius: 10px;
  overflow: hidden;
  text-align: center;
  padding-bottom: 15px;
}

.poster {
  height: 160px;
  background: linear-gradient(145deg, #360000, #171717, #550000);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

.movie h3 {
  padding: 12px 5px;
}

.movie p {
  color: #bbb;
  font-size: 13px;
}

button {
  background: #e50914;
  color: white;
  border: none;
  border-radius: 5px;
  padding: 10px 15px;
  margin-top: 12px;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 25px;
  color: #aaa;
  background: #151515;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
  <h1>🎬 CINEMA WORLD</h1>
  <p>Discover Your Next Favourite Movie</p>
</header>

<div class="search">
  <input
    type="text"
    id="search"
    placeholder="Search movies..."
    oninput="searchMovies()">
</div>

<h2>🔥 Featured Movies</h2>

<div class="movies" id="movies">

  <div class="movie">
    <div class="poster">🎥</div>
    <h3>Movie One</h3>
    <p>Hindi • Drama</p>
    <button onclick="watch('Movie One')">Watch Movie</button>
  </div>

  <div class="movie">
    <div class="poster">🍿</div>
    <h3>Movie Two</h3>
    <p>Hindi • Action</p>
    <button onclick="watch('Movie Two')">Watch Movie</button>
  </div>

  <div class="movie">
    <div class="poster">🎞️</div>
    <h3>Movie Three</h3>
    <p>Hindi • Comedy</p>
    <button onclick="watch('Movie Three')">Watch Movie</button>
  </div>

  <div class="movie">
    <div class="poster">⭐</div>
    <h3>Movie Four</h3>
    <p>Hindi • Adventure</p>
    <button onclick="watch('Movie Four')">Watch Movie</button>
  </div>

</div>

<footer>
  <p>© 2026 Cinema World</p>
  <p>Movies shared with permission</p>
</footer>

<script>
function searchMovies() {
  let input = document.getElementById("search").value.toLowerCase();
  let movies = document.querySelectorAll(".movie");

  movies.forEach(function(movie) {
    let title = movie.querySelector("h3").textContent.toLowerCase();
    movie.style.display = title.includes(input) ? "" : "none";
  });
}

function watch(title) {
  alert(title + ": Add a legally hosted movie video to watch it here.");
}
</script>

</body>
</html>
