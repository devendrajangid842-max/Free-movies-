<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie World</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial}
header{background:#e50914;padding:20px;text-align:center}
header h1{margin:0}
.search{display:flex;gap:8px;padding:15px}
input{flex:1;min-width:0;padding:12px;border:0;border-radius:6px}
button{background:#e50914;color:white;border:0;padding:11px;border-radius:6px;cursor:pointer}
h2{padding:0 15px}
#movies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.card{background:#222;border-radius:8px;overflow:hidden}
.card img{width:100%;display:block;min-height:180px;object-fit:cover}
.info{padding:10px}
.info p{color:#ccc;font-size:13px}
.info button{width:100%}
#message{text-align:center;padding:20px}
footer{text-align:center;padding:20px;color:#aaa}
</style>
</head>

<body>

<header>
<h1>🎬 MOVIE WORLD</h1>
<p>Discover Movies Around The World</p>
</header>

<div class="search">
<input id="search" placeholder="Search any movie...">
<button onclick="searchMovies()">Search</button>
</div>

<h2 id="heading">🔥 Trending Movies</h2>
<div id="movies">
<p id="message">Loading movies...</p>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div id="detailsContent"></div>
  </div>
</div>
<footer>© 2026 Movie World</footer>

<script>
const API_KEY = "4675af0e47c901dc4e5d2c56818b4f6d";
const IMG = "https://image.tmdb.org/t/p/w500";

async function loadMovies(url){
  const box = document.getElementById("movies");
  box.innerHTML = "<p id='message'>Loading movies...</p>";

  try{
    const response = await fetch(url);
    if(!response.ok) throw Error("API request failed");

    const data = await response.json();
    if(!data.results) throw Error("No movies found");

    const movies = data.results.filter(m => m.poster_path);

    if(movies.length === 0){
      box.innerHTML = "<p>No movies found.</p>";
      return;
    }

    box.innerHTML = movies.map(m => `
      <div class="card">
        <img src="${IMG + m.poster_path}"
             alt="${m.title || m.name}"
             loading="lazy">
        <div class="info">
          <b>${m.title || m.name}</b>
          <p>⭐ ${m.vote_average?.toFixed(1) || "N/A"}</p>
          <p>${(m.release_date || "").slice(0,4)}</p>
          <button onclick="details(${m.id})">Details</button>
        </div>
      </div>
    `).join("");

  }catch(error){
    box.innerHTML =
      "<p id='message'>Movies load nahi hui. API key check karo.</p>";
  }
}

function searchMovies(){
  const q = document.getElementById("search").value.trim();

  if(!q){
    document.getElementById("heading").innerText = "🔥 Trending Movies";
    loadMovies("https://api.themoviedb.org/3/trending/movie/week?api_key=" + API_KEY);
    return;
  }

  document.getElementById("heading").innerText = "🔎 Search Results";

  loadMovies(
    "https://api.themoviedb.org/3/search/movie?api_key=" +
    API_KEY + "&query=" + encodeURIComponent(q)
  );
}
async function details(id){
  const modal = document.getElementById("modal");
  const content = document.getElementById("detailsContent");

  modal.style.display = "block";
  content.innerHTML = "<p>Loading details...</p>";

  try {
    const [movieResponse, videoResponse] = await Promise.all([
      fetch("https://api.themoviedb.org/3/movie/" + id + "?api_key=" + API_KEY),
      fetch("https://api.themoviedb.org/3/movie/" + id + "/videos?api_key=" + API_KEY)
    ]);

    if (!movieResponse.ok) throw Error("Details unavailable");

    const m = await movieResponse.json();
    const videoData = videoResponse.ok ? await videoResponse.json() : {results: []};

    const trailer = videoData.results.find(v =>
      v.site === "YouTube" && v.type === "Trailer" && v.key
    ) || videoData.results.find(v => v.site === "YouTube" && v.key);

    content.innerHTML = `
      <button onclick="closeDetails()">✖ Close</button>
      <h2>${m.title}</h2>
      ${m.poster_path ? `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" style="width:150px">` : ""}
      <p>⭐ Rating: ${m.vote_average?.toFixed(1) || "N/A"}/10</p>
      <p>Release Date: ${m.release_date || "Unknown"}</p>
      <p>Story: ${m.overview || "No description available."}</p>
      ${trailer ? `<p><a href="https://www.youtube.com/watch?v=${trailer.key}" target="_blank" style="color:red">▶ Watch Trailer</a></p>` : "<p>Trailer nahi mila.</p>"}
    `;
  } catch (error) {
    content.innerHTML = "<p>Details load nahi hui.</p><button onclick='closeDetails()'>Close</button>";
  }
}

function closeDetails(){
  document.getElementById("modal").style.display = "none";
}

loadMovies(
  "https://api.themoviedb.org/3/trending/movie/week?api_key=" + API_KEY
);
</script>

</body>
</html>
