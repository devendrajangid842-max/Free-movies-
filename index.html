<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Movies | CineVerse</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif}
header{padding:20px 5%;background:#111116;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:25px;font-weight:bold;color:#e50914}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:7px;padding:10px 14px;background:#292932;color:#fff}
button:hover{background:#e50914}
.hero{padding:55px 5%;background:linear-gradient(90deg,#16131d,#291018);min-height:190px}
.hero h1{font-size:36px;margin:0 0 12px}
.search{display:flex;gap:8px;max-width:600px;margin-top:20px}
input{min-width:0;flex:1;padding:13px;border:1px solid #444;border-radius:7px;background:#1c1c24;color:#fff;font-size:16px}
main{padding:20px 5%}
.section-title{margin-top:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:17px}
.card{background:#17171e;border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}
.info{padding:10px}
.info h3{font-size:14px;margin:0 0 8px;line-height:1.35}
.info p{margin:0;color:#bbb;font-size:12px}
.status{color:#bbb;padding:15px 0}
footer{text-align:center;color:#999;padding:30px}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:5;padding:20px;overflow:auto}
.modal-box{max-width:700px;margin:30px auto;background:#191920;padding:20px;border-radius:12px}
.modal-box img{width:140px;max-width:40%;float:left;margin:0 18px 12px 0;border-radius:8px}
.close{float:right;background:#e50914}
a{color:#ff747b}
@media(max-width:500px){.hero h1{font-size:27px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:flex-start}}
</style>
</head>
<body>
<header>
  <div class="logo">CINEVERSE</div>
  <nav>
    <button onclick="loadMovies('trending')">Trending</button>
    <button onclick="loadMovies('latest')">Latest</button>
    <button onclick="loadMovies('bollywood')">Bollywood</button>
    <button onclick="loadMovies('hollywood')">Hollywood</button>
    <button onclick="loadMovies('south')">South Indian</button>
  </nav>
</header>

<section class="hero">
  <h1>Discover Your Next Movie</h1>
  <p>Explore movies, ratings, stories and trailers.</p>
  <div class="search">
    <input id="query" placeholder="Search a movie..." onkeydown="if(event.key==='Enter')runSearch()">
    <button onclick="runSearch()">Search</button>
  </div>
</section>

<main>
  <h2 class="section-title" id="heading">🔥 Trending Movies</h2>
  <div id="status" class="status">Loading movies...</div>
  <div id="movies" class="grid"></div>
</main>

<div id="modal" class="modal" onclick="if(event.target===this)closeDetails()">
  <div class="modal-box">
    <button class="close" onclick="closeDetails()">Close ✕</button>
    <div id="details"></div>
    <div style="clear:both"></div>
  </div>
</div>

<footer>Movie information powered by TMDB. This site does not host movie files.</footer>

<script>
const API_KEY = "4675af0e47c901dc4e5d2c56818b4f6d";
const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";
const moviesEl = document.getElementById("movies");
const statusEl = document.getElementById("status");
const headingEl = document.getElementById("heading");

async function getData(path) {
  const response = await fetch(API + path + (path.includes("?") ? "&" : "?") +
    "api_key=" + API_KEY);
  if (!response.ok) throw new Error("API error " + response.status);
  return response.json();
}

function showMovies(list) {
  moviesEl.innerHTML = "";
  const items = (list || []).filter(m => m.poster_path);
  if (!items.length) {
    statusEl.textContent = "No movies found. Try again.";
    return;
  }
  statusEl.textContent = items.length + " movies found";
  items.forEach(m => {
    const card = document.createElement("article");
    card.className = "card";
    const img = document.createElement("img");
    img.src = IMG + m.poster_path;
    img.alt = m.title || m.name || "Movie poster";
    img.loading = "lazy";
    const info = document.createElement("div");
    info.className = "info";
    const title = document.createElement("h3");
    title.textContent = m.title || m.name || "Untitled";
    const meta = document.createElement("p");
    meta.textContent = "⭐ " + (m.vote_average ? m.vote_average.toFixed(1) : "N/A") +
      " · " + ((m.release_date || m.first_air_date || "").slice(0,4) || "Year N/A");
    info.append(title, meta);
    card.append(img, info);
    card.onclick = () => showDetails(m);
    moviesEl.appendChild(card);
  });
}

async function loadMovies(type) {
  const configs = {
    trending: ["/trending/movie/week", "🔥 Trending Movies"],
    latest: ["/movie/now_playing", "🎬 Now Playing"],
    bollywood: ["/discover/movie?with_original_language=hi&sort_by=popularity.desc", "🇮🇳 Bollywood"],
    hollywood: ["/discover/movie?with_original_language=en&sort_by=popularity.desc", "🇺🇸 Hollywood"],
    south: ["/discover/movie?with_original_language=ta&sort_by=popularity.desc", "🎥 Tamil Movies"]
  };
  const config = configs[type] || configs.trending;
  headingEl.textContent = config[1];
  moviesEl.innerHTML = "";
  statusEl.textContent = "Loading movies...";
  try {
    const data = await getData(config[0]);
    showMovies(data.results);
  } catch (err) {
    statusEl.textContent = "Movies load nahi hui. Internet/API Key check karo. Error: " + err.message;
  }
}

async function runSearch() {
  const q = document.getElementById("query").value.trim();
  if (!q) {
    statusEl.textContent = "Pehle movie ka naam likho.";
    return;
  }
  headingEl.textContent = "🔎 Search: " + q;
  moviesEl.innerHTML = "";
  statusEl.textContent = "Searching movies...";
  try {
    const data = await getData("/search/movie?query=" + encodeURIComponent(q));
    showMovies(data.results);
  } catch (err) {
    statusEl.textContent = "Search failed. Error: " + err.message;
  }
}

async function showDetails(movie) {
  const modal = document.getElementById("modal");
  const details = document.getElementById("details");
  modal.style.display = "block";
  details.innerHTML = "<p>Loading details...</p>";
  try {
    const data = await getData("/movie/" + movie.id);
    details.innerHTML = "";
    if (data.poster_path) {
      const img = document.createElement("img");
      img.src = IMG + data.poster_path;
      img.alt = data.title || "Movie poster";
      details.appendChild(img);
    }
    const title = document.createElement("h2");
    title.textContent = data.title || "Movie details";
    const rating = document.createElement("p");
    rating.textContent = "⭐ Rating: " + (data.vote_average ? data.vote_average.toFixed(1) : "N/A");
    const date = document.createElement("p");
    date.textContent = "Release date: " + (data.release_date || "Unknown");
    const overview = document.createElement("p");
    overview.textContent = data.overview || "No description available.";
    const trailer = document.createElement("p");
    trailer.innerHTML = '<a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=' +
      encodeURIComponent((data.title || "") + " official trailer") + '">Watch trailer on YouTube</a>';
    details.append(title, rating, date, overview, trailer);
  } catch (err) {
    details.textContent = "Details load nahi hue: " + err.message;
  }
}

function closeDetails() {
  document.getElementById("modal").style.display = "none";
}

loadMovies("trending");
</script>
</body>
</html>
